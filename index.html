  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

br>Snažím se až zneužít AI revoluci.<\u002Fp>\n        <div data-reveal=\"\" style=\"display:flex;flex-wrap:wrap;gap:12px;margin-top:34px\">\n          <a href=\"#projects\" data-target=\"projects\" onclick=\"{{ onNavClick }}\" style=\"display:inline-flex;align-items:center;gap:9px;background:var(--accent);color:var(--on-accent);font-size:15px;font-weight:500;text-decoration:none;padding:14px 22px;border-radius:10px;transition:background .15s ease,transform .1s ease\">Zobrazit projekty <svg width=\"15\" height=\"15\" viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><path d=\"M3 8h9M8.5 4l4 4-4 4\"><\u002Fpath><\u002Fsvg><\u002Fa>\n          <a href=\"https://www.linkedin.com/in/adam-zikmund-ba3469360/\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;gap:9px;background:var(--surface);color:var(--text);font-size:15px;font-weight:500;text-decoration:none;padding:14px 20px;border-radius:10px;border:1px solid var(--border);transition:border-color .15s ease\">LinkedIn<\u002Fa>\n          <a href=\"mailto:zikmundi@proton.me\" style=\"display:inline-flex;align-items:center;gap:9px;background:var(--surface);color:var(--text);font-size:15px;font-weight:500;text-decoration:none;padding:14px 20px;border-radius:10px;border:1px solid var(--border);transition:border-color .15s ease\">Napsat e-mail<\u002Fa>\n        <\u002Fdiv>\n        \n      <\u002Fdiv>\n      \n    <\u002Fsection><section id=\"about\" data-screen-label=\"O mně\" aria-labelledby=\"about-h\" style=\"max-width:1080px;margin:0 auto;padding:24px 24px\">\n      <div style=\"max-width:680px\">\n        <p data-reveal=\"\" style=\"font-family:var(--fmono);font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--text-muted);margin:0 0 20px\">O mně<\u002Fp>\n        <h2 id=\"about-h\" data-reveal=\"\" style=\"font-family:var(--fhead),'Inter',sans-serif;font-weight:450;font-size:clamp(28px,4vw,40px);line-height:1.12;letter-spacing:-.018em;margin:0 0 28px;color:var(--text)\">Co-founder a builder z Prahy.<\u002Fh2>\n        <div style=\"display:flex;flex-direction:column;gap:20px;font-size:17px;line-height:1.65;color:var(--text-secondary)\">\n          <p data-reveal=\"\" style=\"margin:0\">Jsem co-founder a builder/developer z Prahy s pevnými základy z matematiky, fyziky a IT z Gymnázia Christiána Dopplera. Založil jsem EdTech platformu <a href=\"https://freio.cz\" target=\"_blank\" rel=\"noopener\" style=\"color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border-strong);\">Freio<\u002Fa> (příprava na SCIO přijímačky na české VŠ) a neziskovou platformu <a href=\"https://boziii.com\" target=\"_blank\" rel=\"noopener\" style=\"color: var(--text); text-decoration: none; border-bottom: 1px solid var(--border-strong);\">boziii.com<\u002Fa> — u obou jsem stavěl software, marketing i obchodní stránku. Od roku 2023 navíc freelancuju na softwaru, AI automatizacích a finančních nástrojích.<\u002Fp>\n          <p data-reveal=\"\" data-delay=\"60\" style=\"margin:0\">Teď jdu hloub do Finanční matematiky: od podzimu 2026 studuju finanční matematiku na MFF UK a čím dál víc mě táhne riziko, trhy a kvantitativní finance. Abych se učil praxí, stavím malé interaktivní finanční projekty - můžete se podívat níže :) .<\u002Fp>\n          <p data-reveal=\"\" data-delay=\"120\" style=\"margin:0\">Rád poznám nové lidi a sbírám nevšední zkušenosti.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n        <section id=\"projects\" data-screen-label=\"Projekty\" aria-labelledby=\"proj-h\" style=\"max-width:1080px;margin:0 auto;padding:104px 24px 24px\">\n      <p data-reveal=\"\" style=\"font-family:var(--fmono);font-size:13px;font-weight:500;letter-spacing:.08em;color:var(--text-muted);margin:0 0 20px\">Projekty<\u002Fp>\n      \n      \n      <div data-reveal=\"\" style=\"display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:8px 0 24px;flex-wrap:wrap\">\n        <h3 ight .4s cubic-bezier(.22,1,.36,1),background .2s ease;min-height:2px';\n      track.appendChild(fill);const lab=document.createElement('span');lab.textContent=L;lab.style.cssText='font-family:var(--fmono);font-size:10px;color:var(--text-muted)';\n      col.appendChild(track);col.appendChild(lab);wrap.appendChild(col);return fill; });\n    const readAssets=()=>SL.map((a,i)=>({r:Math.max(0,(+a.r.inp.value)+st.shock[i]),s:+a.s.inp.value}));\n    const self=this;let sim=null;\n    const render=(anim)=>{\n      SL.forEach(a=>{a.r.sync();a.s.sync();});corr.sync();\n      sim=self.mkSim(readAssets(),+corr.inp.value,st.noShort,2);const b=sim.best;\n      if(anim&&!self.reduce) self.countUp(out('sharpe'),b.sh,{dec:2,dur:550}); else out('sharpe').textContent=b.sh.toFixed(2);\n      out('t_ret').textContent=b.rp.toFixed(1)+' %';out('t_risk').textContent=b.sp.toFixed(1)+' %';out('t_sharpe').textContent=b.sh.toFixed(2);\n      out('retBadge').textContent='▲ +'+b.rp.toFixed(1)+' %';\n      const mxw=Math.max.apply(null,b.w.map(Math.abs).concat([0.01]));\n      bars.forEach((f,i)=>{const wv=b.w[i];f.style.height=(Math.abs(wv)/mxw*30)+'px';f.style.background=wv<0?'var(--text-muted)':'var(--accent)';f.style.borderRadius=wv<0?'0 0 3px 3px':'3px 3px 0 0';f.parentElement.style.alignItems=wv<0?'flex-start':'flex-end';});\n      self.drawMK(cv,sim,star,anim);\n    };\n    let pend=false;\n    SL.reduce((acc,a)=>acc.concat([a.r,a.s]),[corr]).forEach(s=>s.inp.addEventListener('input',()=>{if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;render(false);});}));\n    card.querySelectorAll('[data-k=\"short\"]').forEach(btn=>btn.addEventListener('click',()=>{st.noShort=btn.dataset.v==='no';\n      card.querySelectorAll('[data-k=\"short\"]').forEach(b=>{const on=(b.dataset.v==='no')===st.noShort;b.style.background=on?'var(--nav-bg)':'transparent';b.style.color=on?'#fff':'var(--text-secondary)';});render(true);}));\n    card.querySelector('[data-k=\"shock\"]').addEventListener('clic 100,150,200,250,300,51,102,153,204,4,54,104,154,254,304],\n    T:[0,1,2,3,4,52,102,152,202,252,302],\n    E:[0,1,2,3,4,50,100,150,200,250,300,301,302,303,304,151,152],\n    S:[1,2,3,4,50,100,151,152,153,204,254,300,301,302,303],\n    I:[0,1,2,3,4,52,102,152,202,252,300,301,302,303,304],\n    ' ':[]\n  }; }\n  buildCommits(text){\n    const wrap=this.commitsWrap.current; if(!wrap) return; wrap.innerHTML='';\n    const LP=this._lp();\n    const clean=text.toUpperCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').split('').filter(c=>LP[c]!==undefined).join('');\n    const width=Math.max(clean.length*6,6)+1, height=9; let pos=1; const hi=new Set();\n    clean.split('').forEach(ch=>{ const pat=LP[ch]; if(pat) pat.forEach(p=>{ const row=Math.floor(p/50),col=p%50; hi.add((row+1)*width+col+pos); }); pos+=6; });\n    const grid=document.createElement('div');\n    grid.style.cssText='display:grid;gap:6px;width:100%;max-width:none;grid-template-columns:repeat('+width+',1fr);grid-template-rows:repeat('+height+',1fr)';\n    const colors=['#48d55d','#1F8A4A','#0d4429']; const reduce=this.reduce;\n    for(let i=0;i<width*height;i++){\n      const cell=document.createElement('div'); const on=hi.has(i); const flash=!on&&Math.random()<0.26;\n      cell.style.cssText='aspect-ratio:1;border-radius:3px;background:'+(on?(reduce?colors[0]:'transparent'):'transparent');\n      if(on&&!reduce){ cell.style.setProperty('--hl',colors[Math.floor(Math.random()*colors.length)]); cell.style.animation='azGridHi .5s ease forwards'; cell.style.animationDelay=(Math.random()*0.7).toFixed(2)+'s'; }\n      else if(flash&&!reduce){ cell.style.animation='azGridFlash 2.6s ease-in-out infinite'; cell.style.animationDelay=(Math.random()*0.6).toFixed(2)+'s'; }\n      grid.appendChild(cell);\n    }\n    wrap.appendChild(grid);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
